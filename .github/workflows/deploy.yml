name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install -r ml/requirements.txt

      - name: Run tests
        run: |
          pytest tests/

  # Uncomment the jobs below once you configure Docker Hub and SSH Secrets in GitHub settings

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sentro-app:latest

      - name: Build and push ML Detector Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ml/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sentro-ml-detector:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy Compose & Monitoring Configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,prometheus/,grafana/,ml/,scripts/"
          target: "/home/ubuntu/sentro"

      - name: Deploy Stack via Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/sentro
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            sudo systemctl stop node_exporter || true
            sudo systemctl disable node_exporter || true
            sudo -E docker compose pull
            sudo -E docker compose down || true
            sudo -E docker compose up -d --remove-orphans
